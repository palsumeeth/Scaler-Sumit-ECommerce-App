#Application Config
spring.application.name=product-catalog-service
logging.level.root=DEBUG
server.port=9004
server.servlet.context-path=/product-catalog
#Database
spring.datasource.url=jdbc:postgresql://localhost:5432/product_catalog
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
http.cors.enabled: true
http.cors.allow-origin: "http://localhost:8084"
http.cors.allow-headers: X-Requested-With,Content-Type,Content-Length,Authorization