spring.application.name=payment-service
server.port=9007
logging.level.org.springframework.core.env=DEBUG

spring.datasource.url=jdbc:postgresql://localhost:5432/payment_db
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.missing-topics-fatal=false
# Razorpay properties
nxt.razorpay.key=${NXT_RAZORPAY_KEY}
nxt.razorpay.secret=${NXT_RAZORPAY_SECRET}
nxt.razorpay.webhook.secret=${NXT_RAZORPAY_WEBHOOK_SECRET}
# Stripe properties
nxt.stripe.api.key=${NXT_STRIPE_API_KEY}
nxt.stripe.webhook.secret=${NXT_STRIPE_WEBHOOK_SECRET}
