spring.application.name=user-service
#Application Config
logging.level.root=DEBUG
server.port=9002
server.servlet.context-path=/user-mgmt
#Database
spring.datasource.url=jdbc:postgresql://localhost:5432/user_db
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
#Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

jwt.secret=${JWT_SECRET:local-dev-jwt-secret-change-me-32b}
jwt.algorithm=HS256
jwt.access-expiration-seconds=900
jwt.refresh-expiration-seconds=604800
token.hash.secret=${TOKEN_HASH_SECRET:local-dev-token-hash-secret-32b}